name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same branch to avoid wasting minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The lower bound comes from `engines.node` (pdfjs-dist@6 requires >=22.13); the upper
        # bound is the current LTS line so new breaking majors surface as a job failure, not
        # silently later.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # Strict on purpose: the prebuilt native binaries (`better-sqlite3`, `sharp`,
        # `@napi-rs/canvas`) exist for ubuntu and Windows, so a failed install is a real problem,
        # not flakiness. Letting it fail here keeps the cause visible instead of producing confusing
        # downstream failures in type-check, build or tests against a half-installed tree.
        run: npm ci

      - name: Type check
        run: npm run lint

      # Chromium for the browser tests, installed explicitly.
      #
      # `tests/pinned-proxy.test.ts` launches a real Chromium, and a runner with no browser binary for
      # this Playwright version fails there - a red CI job whose cause is the environment rather than
      # the commit. The `playwright` package downloads a browser in its own install script, which is
      # why this was ever missed: it works on a developer machine and on the ubuntu image's shared
      # cache, and fails on a fresh runner or after a version bump.
      #
      # `install-deps` is Linux-only and errors on Windows and macOS, so it is a separate guarded step
      # rather than `--with-deps`. Chromium alone is enough here: the test needs a browser to run, not
      # the whole cross-browser matrix, and the proxy code it covers is browser-agnostic.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install OS packages Chromium needs
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Static verification
        run: npm run verify:static

      - name: Registry verification
        run: npm run verify:registry

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify the published tarball is executable and secret-free
        run: npm run verify:package

  # Alpine/musl is where the native binaries (`sharp`, `@napi-rs/canvas`, `better-sqlite3`)
  # usually fail to build. The server must still boot there and degrade to "this tool is
  # unavailable" rather than aborting at import time — which is exactly what a static import used
  # to do. This job asserts the degraded path: install without build scripts, compile, boot, and
  # verify the registry. The full suite does not run here because several tests exercise the native
  # modules themselves (SQLite seeding, real OCR); those run in the ubuntu/windows/macos matrix.
  alpine:
    name: Alpine (musl, degraded native deps)
    runs-on: ubuntu-latest
    container: node:24-alpine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Pure-JS install only: no compiler toolchain in the container, and the point of this job is
      # the host where native builds are absent. `tsc` and `tsx` are pure JS, so build and the
      # registry check below still run for real.
      - name: Install without build scripts
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # The server must boot with the native binaries absent, which is what a slim container or a
      # failed node-gyp build looks like. Removing what `--ignore-scripts` may still have placed
      # makes the simulation explicit rather than incidental.
      - name: Remove native media binaries to simulate a degraded host
        run: rm -rf node_modules/sharp node_modules/@napi-rs node_modules/tesseract.js node_modules/better-sqlite3

      - name: Server must boot without native binaries
        run: |
          node -e "import('./dist/server.js').then(()=>{console.log('BOOT_OK')}).catch(e=>{console.error('BOOT_FAIL',e.code||e.message);process.exit(1)})"

      - name: Static checks still pass without native binaries
        run: npm run verify:static

      - name: Registry still verifies
        run: npm run verify:registry

  publish-dry-run:
    name: Pack check
    runs-on: ubuntu-latest
    needs: [verify, alpine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run